<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">Data Rift neon icon</title>
  <desc id="desc">A cyan broken circular ring crossed by a purple-to-cyan diagonal rift.</desc>

  <defs>
    <!-- Main neon palette -->
    <linearGradient id="ringGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00BDF8"/>
      <stop offset="34%"  stop-color="#00E8FF"/>
      <stop offset="67%"  stop-color="#45FFF5"/>
      <stop offset="100%" stop-color="#00B8FF"/>
    </linearGradient>

    <linearGradient id="ringHighlight" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#B7FFFF"/>
      <stop offset="32%" stop-color="#31FFF7"/>
      <stop offset="100%" stop-color="#00A8F8"/>
    </linearGradient>

    <linearGradient id="riftGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#712DFF"/>
      <stop offset="21%"  stop-color="#A04CFF"/>
      <stop offset="45%"  stop-color="#9C72FF"/>
      <stop offset="67%"  stop-color="#42DFFF"/>
      <stop offset="100%" stop-color="#00EFFF"/>
    </linearGradient>

    <radialGradient id="coreGradient" cx="48%" cy="43%" r="62%">
      <stop offset="0%" stop-color="#102138"/>
      <stop offset="58%" stop-color="#071322"/>
      <stop offset="100%" stop-color="#010713"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="riftGlow" x="-25%" y="-45%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark inner core. The SVG background itself remains transparent. -->
  <circle cx="512" cy="512" r="267"
          fill="url(#coreGradient)"
          stroke="#03101D" stroke-width="4"/>

  <!-- Broad outer neon glow -->
  <path d="M 194.89 456.09 A 322 322 0 1 1 248.23 696.69"
        fill="none"
        stroke="#00DFF6" stroke-opacity="0.28"
        stroke-width="90" stroke-linecap="butt"
        filter="url(#softGlow)"/>

  <!-- Main broken ring -->
  <path d="M 194.89 456.09 A 322 322 0 1 1 248.23 696.69"
        fill="none"
        stroke="url(#ringGradient)"
        stroke-width="66"
        stroke-linecap="butt"/>

  <!-- Bright outer rim -->
  <path d="M 194.89 456.09 A 322 322 0 1 1 248.23 696.69"
        fill="none"
        stroke="url(#ringHighlight)"
        stroke-opacity="0.78"
        stroke-width="4"
        stroke-linecap="butt"
        transform="translate(0,-1)"/>

  <!-- Inner translucent band -->
  <path d="M 224.82 471.64 A 290 290 0 1 1 268.79 669.95"
        fill="none"
        stroke="#1EEBFA"
        stroke-opacity="0.34"
        stroke-width="24"
        stroke-linecap="butt"/>

  <!-- Inner cyan orbital rim -->
  <circle cx="512" cy="512" r="267"
          fill="none"
          stroke="#05E9FF"
          stroke-width="5"
          stroke-opacity="0.96"
          filter="url(#tightGlow)"/>

  <!-- Faint second rim adds the layered/glass feel of the raster original -->
  <circle cx="512" cy="512" r="276"
          fill="none"
          stroke="#4FFFF7"
          stroke-width="2"
          stroke-opacity="0.34"/>

  <!-- Diagonal rift glow -->
  <path d="M 104 726
           L 893 321
           L 921 327
           L 151 754 Z"
        fill="url(#riftGradient)"
        opacity="0.40"
        filter="url(#riftGlow)"/>

  <!-- Main tapered rift -->
  <path d="M 111 728
           L 895 325
           L 913 329
           L 145 749 Z"
        fill="url(#riftGradient)"/>

  <!-- Glassy upper highlight on the rift -->
  <path d="M 134 726
           L 897 329
           L 904 330
           L 153 741 Z"
        fill="#B9FFFF"
        opacity="0.23"/>

  <!-- Slight cyan flare at the right tip -->
  <path d="M 850 345 L 895 325 L 913 329 L 877 350 Z"
        fill="#54FFF5" opacity="0.72"/>

  <!-- Slight violet flare at the left tip -->
  <path d="M 111 728 L 145 749 L 187 725 L 153 718 Z"
        fill="#772BFF" opacity="0.58"/>
</svg>
